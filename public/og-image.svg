      <stop offset="0%" stop-color="#142a21"/>
      <stop offset="100%" stop-color="#2d5c4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- repère visuel discret, sans image bitmap -->
  <g fill="#ffffff" opacity="0.05">
