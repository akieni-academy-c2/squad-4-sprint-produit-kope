  </g>

  <rect x="90" y="196" width="112" height="10" rx="5" fill="#548c68"/>

  <text x="90" y="330" font-family="Inter, system-ui, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">KOP</text>

  <text x="90" y="404" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" fill="#d5e4da">Annuaire des artisans</text>

