<!doctype html>
<html lang="fr-CG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>KOP | Annuaire des artisans du Congo</title>
    <meta
      name="description"
      content="KOP - l'annuaire des artisans du bâtiment au Congo (Brazzaville). Plombier, électricien, maçon, menuisier. Trouvez un professionnel vérifié près de chez vous."
    />

    <!-- Signature éditoriale : elle n'est jamais rendue à l'écran, elle
         associe le site à son auteur dans les résultats de recherche et les
         métadonnées de partage. Volontairement absente du <title> affiché
         dans l'onglet du navigateur. -->
    <meta name="author" content="Espoir LOEMBA" />
    <meta name="creator" content="Espoir LOEMBA" />
    <meta name="publisher" content="Espoir LOEMBA" />
    <meta name="keywords" content="artisan Congo Brazzaville plombier électricien maçon menuisier,KOP,Espoir LOEMBA" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Palette verte de l'application. La valeur précédente était orange,
         couleur qui n'apparaît nulle part dans le design. -->
    <meta name="theme-color" content="#2d5c4a" />

    <!-- Partage sur les réseaux sociaux : sans og:*, un lien partagé sur
         WhatsApp ou Facebook s'affiche sans titre ni aperçu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KOP" />
    <meta property="og:locale" content="fr_CG" />
    <meta property="og:title" content="KOP | Annuaire des artisans du Congo" />
    <meta
      property="og:description"
      content="L'annuaire des artisans du bâtiment au Congo. Plombier, électricien, maçon, menuisier."
    />
    <!-- PNG et non SVG : les réseaux sociaux refusent le SVG en aperçu. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KOP — Annuaire des artisans, Congo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KOP | Annuaire des artisans du Congo" />
    <meta
      name="twitter:description"
      content="L'annuaire des artisans du bâtiment au Congo. Plombier, électricien, maçon, menuisier."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="robots" content="index, follow" />

    <!-- Un seul bloc de préchargement, et les familles réellement utilisées :
         Geist et Moirai One étaient chargées ici alors que le design est en
         Inter et Moo Lah Lah — deux requêtes réseau payées pour rien. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Moo+Lah+Lah&display=swap"
    />

    <!-- Données structurées : c'est ce que Google lit pour associer le site
         à son auteur et construire la fiche affichée dans ses résultats. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "KOP",
        "alternateName": "KOP Annuaire des artisans",
        "description": "Annuaire des artisans du bâtiment au Congo (Brazzaville).",
        "inLanguage": "fr-CG",
        "author": {
          "@type": "Person",
          "name": "Espoir LOEMBA"
        },
        "publisher": {
          "@type": "Person",
          "name": "Espoir LOEMBA"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
