<!doctype html>
<html lang="fr-CG">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>KOP | Annuaire des artisans du Congo</title>
    <meta
      name="description"
      content="KOP - l'annuaire des artisans du bâtiment au Congo (Brazzaville). Plombier, électricien, maçon, menuisier. Trouvez un professionnel vérifié près de chez vous."
    />

    <!-- Les balises author / creator et le JSON-LD sont injectés au build par le
plugin `kop-head-tags` (vite.config.js), depuis src/shared/data/credits.js. -->
    <meta name="publisher" content="Espoir LOEMBA" />
    <meta
      name="keywords"
      content="artisan Congo Brazzaville plombier électricien maçon menuisier,KOP,Espoir LOEMBA"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KOP" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KOP" />

    <!-- Palette verte de l'application. La valeur précédente était orange,
         couleur qui n'apparaît nulle part dans le design. -->
    <meta name="theme-color" content="#2d5c4a" />

    <!-- Partage sur les réseaux sociaux : sans og:*, un lien partagé sur
         WhatsApp ou Facebook s'affiche sans titre ni aperçu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KOP" />
    <meta property="og:locale" content="fr_CG" />
    <meta property="og:title" content="KOP | Annuaire des artisans du Congo" />
    <meta
      property="og:description"
      content="L'annuaire des artisans du bâtiment au Congo. Plombier, électricien, maçon, menuisier."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="KOP - Annuaire des artisans, Congo"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KOP | Annuaire des artisans du Congo" />
    <meta
      name="twitter:description"
      content="L'annuaire des artisans du bâtiment au Congo. Plombier, électricien, maçon, menuisier."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="robots" content="index, follow" />

    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
